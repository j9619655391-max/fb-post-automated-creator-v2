services:
  postgres:
    image: postgres:16-alpine
    container_name: fb-post-app-postgres
    environment:
      POSTGRES_USER: fb_post
      POSTGRES_PASSWORD: local_staging_password
      POSTGRES_DB: fb_post_local
    ports:
      - "5432:5432"
    volumes:
      - fb_post_app_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fb_post -d fb_post_local"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: fb-post-app-redis
    ports:
      - "6379:6379"
    volumes:
      - fb_post_app_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  api:
    build: .
    image: fb-post-automated-creator:local
    container_name: fb-post-app-api
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
      - ./alembic:/app/alembic
      - ./scripts:/app/scripts
      - ./frontend/dist:/app/frontend/dist
      - ./tests:/app/tests
      - ./data:/app/data
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://fb_post:local_staging_password@postgres:5432/fb_post_local
      CELERY_BROKER_URL: redis://redis:6379/0
    command: sh -c "python -m scripts.init_db && exec uvicorn app.main:app --host 0.0.0.0 --port 8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  celery:
    build: .
    image: fb-post-automated-creator:local
    container_name: fb-post-app-celery
    command: celery -A app.scheduler worker -l info
    volumes:
      - ./app:/app/app
      - ./alembic:/app/alembic
      - ./scripts:/app/scripts
      - ./frontend/dist:/app/frontend/dist
      - ./tests:/app/tests
      - ./data:/app/data
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://fb_post:local_staging_password@postgres:5432/fb_post_local
      CELERY_BROKER_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  celery-beat:
    build: .
    image: fb-post-automated-creator:local
    container_name: fb-post-app-celery-beat
    command: celery -A app.scheduler beat -l info
    volumes:
      - ./app:/app/app
      - ./alembic:/app/alembic
      - ./scripts:/app/scripts
      - ./frontend/dist:/app/frontend/dist
      - ./tests:/app/tests
      - ./data:/app/data
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://fb_post:local_staging_password@postgres:5432/fb_post_local
      CELERY_BROKER_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  fb_post_app_pgdata:
  fb_post_app_redisdata:
