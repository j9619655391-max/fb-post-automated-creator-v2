services:
  postgres:
    image: postgres:16
    container_name: fb-post-local-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: fb_post
      POSTGRES_PASSWORD: local_staging_password
      POSTGRES_DB: fb_post_local
    ports:
      - "5432:5432"
    volumes:
      - fb_post_local_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fb_post -d fb_post_local"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: fb-post-local-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - fb_post_local_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  fb_post_local_pgdata:
  fb_post_local_redisdata:
